name: Publish Extension

on:
  # Tap "Run workflow" from the GitHub mobile site to cut a release.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  # Pushing a v* tag by hand still publishes that exact version.
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Read from the environment rather than passed as arguments, where a token
    # would be visible in the runner's process list.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # A dispatch run commits the version bump, so it needs main, not a detached tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        # Not `npm install`: it can rewrite package-lock.json, and the version
        # bump below refuses to run with a dirty working tree.
        run: npm ci

      - name: Compile and run the tests
        run: npm test

      - name: Require a changelog entry for the version being released
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target=$(npx --yes semver -i "${{ inputs.bump }}" "$current")
          else
            target="$current"
          fi
          echo "Looking for the $target section in CHANGELOG.md"
          escaped=$(printf '%s' "$target" | sed 's/\./\\./g')
          if ! grep -Eq "^##[[:space:]]+\\[?${escaped}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$target]' section. Add one, then run this workflow again."
            exit 1
          fi

      - name: Identify the commit author
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # vsce raises the version, commits it, tags it, then publishes in one step.
      - name: Raise the version and publish
        if: github.event_name == 'workflow_dispatch'
        run: npx --yes @vscode/vsce publish ${{ inputs.bump }}

      - name: Push the version bump and its tag
        if: github.event_name == 'workflow_dispatch'
        run: git push --follow-tags origin main

      - name: Publish the tagged version
        if: github.event_name == 'push'
        run: npx --yes @vscode/vsce publish

      - name: Publish to Open VSX
        # Skipped outright without the secret. Passing an empty --pat made the
        # step fail every release instead.
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: npx --yes ovsx publish
